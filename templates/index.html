<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eCourts Cause List Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: none;
        }
        .card-header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .btn-primary {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .loading {
            display: none;
        }
        .result {
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }
        .downloads-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .form-control, .form-select {
            border-radius: 10px;
            padding: 12px;
            border: 2px solid #e9ecef;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card mb-4">
                    <div class="card-header text-center">
                        <h1 class="mb-0"><i class="fas fa-gavel me-2"></i>eCourts Cause List Scraper</h1>
                        <p class="mb-0 mt-2">Download court cause lists in PDF format</p>
                    </div>
                    <div class="card-body p-4">
                        <form id="causeListForm">
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">State</label>
                                    <select class="form-select" id="stateSelect" required>
                                        <option value="">Loading states...</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">District</label>
                                    <select class="form-select" id="districtSelect" disabled required>
                                        <option value="">Select state first</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Court Complex</label>
                                    <select class="form-select" id="complexSelect" disabled required>
                                        <option value="">Select district first</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Court (Optional)</label>
                                    <select class="form-select" id="courtSelect" disabled>
                                        <option value="">All Courts</option>
                                    </select>
                                    <small class="text-muted">Leave empty to download all courts in the complex</small>
                                </div>
                            </div>
                            
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Date</label>
                                    <input type="date" class="form-control" id="dateInput" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">&nbsp;</label>
                                    <div class="d-grid">
                                        <button type="submit" class="btn btn-primary btn-lg">
                                            <i class="fas fa-download me-2"></i>Download Cause List
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="downloadAllCheck">
                                <label class="form-check-label fw-bold" for="downloadAllCheck">
                                    <i class="fas fa-layer-group me-2"></i>Download cause lists for ALL courts in this complex
                                </label>
                            </div>
                        </form>
                        
                        <div id="loading" class="loading text-center py-4">
                            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                                <span class="visually-hidden">Loading...</span>
                            </div>
                            <p class="mt-3 fs-5">Downloading cause lists... This may take a few minutes.</p>
                        </div>
                        
                        <div id="result" class="mt-3"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="fas fa-file-download me-2"></i>Downloaded Files</h5>
                    </div>
                    <div class="card-body">
                        <div id="downloadsList" class="downloads-list">
                            <p class="text-muted text-center">No files downloaded yet</p>
                        </div>
                        <div class="text-center mt-3">
                            <button class="btn btn-outline-primary" onclick="loadDownloads()">
                                <i class="fas fa-sync-alt me-2"></i>Refresh List
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize date to today
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('dateInput').value = today;
            
            // Load states
            loadStates();
            loadDownloads();
        });

        function loadStates() {
            fetch('/states')
                .then(response => response.json())
                .then(states => {
                    const stateSelect = document.getElementById('stateSelect');
                    stateSelect.innerHTML = '<option value="">Select State</option>';
                    states.forEach(state => {
                        const option = document.createElement('option');
                        option.value = state.code;
                        option.textContent = state.name;
                        stateSelect.appendChild(option);
                    });
                });
        }

        function loadDistricts(stateCode) {
            const districtSelect = document.getElementById('districtSelect');
            districtSelect.disabled = true;
            districtSelect.innerHTML = '<option value="">Loading districts...</option>';
            
            fetch(`/districts/${stateCode}`)
                .then(response => response.json())
                .then(districts => {
                    districtSelect.innerHTML = '<option value="">Select District</option>';
                    districts.forEach(district => {
                        const option = document.createElement('option');
                        option.value = district.code;
                        option.textContent = district.name;
                        districtSelect.appendChild(option);
                    });
                    districtSelect.disabled = false;
                    
                    // Reset dependent selects
                    resetSelect('complexSelect', 'Select district first');
                    resetSelect('courtSelect', 'All Courts');
                });
        }

        function loadComplexes(stateCode, districtCode) {
            const complexSelect = document.getElementById('complexSelect');
            complexSelect.disabled = true;
            complexSelect.innerHTML = '<option value="">Loading court complexes...</option>';
            
            fetch(`/complexes/${stateCode}/${districtCode}`)
                .then(response => response.json())
                .then(complexes => {
                    complexSelect.innerHTML = '<option value="">Select Court Complex</option>';
                    complexes.forEach(complex => {
                        const option = document.createElement('option');
                        option.value = complex.code;
                        option.textContent = complex.name;
                        complexSelect.appendChild(option);
                    });
                    complexSelect.disabled = false;
                    
                    // Reset court select
                    resetSelect('courtSelect', 'All Courts');
                });
        }

        function loadCourts(stateCode, districtCode, complexCode) {
            const courtSelect = document.getElementById('courtSelect');
            courtSelect.disabled = true;
            courtSelect.innerHTML = '<option value="">Loading courts...</option>';
            
            fetch(`/courts/${stateCode}/${districtCode}/${complexCode}`)
                .then(response => response.json())
                .then(courts => {
                    courtSelect.innerHTML = '<option value="">All Courts</option>';
                    courts.forEach(court => {
                        const option = document.createElement('option');
                        option.value = court.code;
                        option.textContent = court.name;
                        courtSelect.appendChild(option);
                    });
                    courtSelect.disabled = false;
                });
        }

        function resetSelect(selectId, placeholder) {
            const select = document.getElementById(selectId);
            select.disabled = true;
            select.innerHTML = `<option value="">${placeholder}</option>`;
        }

        function loadDownloads() {
            fetch('/downloads')
                .then(response => response.json())
                .then(downloads => {
                    const downloadsList = document.getElementById('downloadsList');
                    
                    if (downloads.length === 0) {
                        downloadsList.innerHTML = '<p class="text-muted text-center">No files downloaded yet</p>';
                        return;
                    }
                    
                    let html = '<div class="list-group">';
                    downloads.forEach(file => {
                        html += `
                            <div class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <i class="fas fa-file-pdf text-danger me-2"></i>
                                    <span class="fw-bold">${file.name}</span>
                                    <small class="text-muted ms-2">${file.size}</small>
                                </div>
                                <a href="/download-file/${file.name}" class="btn btn-sm btn-outline-primary">
                                    <i class="fas fa-download"></i> Download
                                </a>
                            </div>
                        `;
                    });
                    html += '</div>';
                    downloadsList.innerHTML = html;
                });
        }

        // Event listeners
        document.getElementById('stateSelect').addEventListener('change', function() {
            const stateCode = this.value;
            if (stateCode) {
                loadDistricts(stateCode);
            } else {
                resetSelect('districtSelect', 'Select state first');
                resetSelect('complexSelect', 'Select district first');
                resetSelect('courtSelect', 'All Courts');
            }
        });

        document.getElementById('districtSelect').addEventListener('change', function() {
            const stateCode = document.getElementById('stateSelect').value;
            const districtCode = this.value;
            if (stateCode && districtCode) {
                loadComplexes(stateCode, districtCode);
            } else {
                resetSelect('complexSelect', 'Select district first');
                resetSelect('courtSelect', 'All Courts');
            }
        });

        document.getElementById('complexSelect').addEventListener('change', function() {
            const stateCode = document.getElementById('stateSelect').value;
            const districtCode = document.getElementById('districtSelect').value;
            const complexCode = this.value;
            if (stateCode && districtCode && complexCode) {
                loadCourts(stateCode, districtCode, complexCode);
            } else {
                resetSelect('courtSelect', 'All Courts');
            }
        });

        // Form submission
        document.getElementById('causeListForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const stateCode = document.getElementById('stateSelect').value;
            const districtCode = document.getElementById('districtSelect').value;
            const complexCode = document.getElementById('complexSelect').value;
            const courtCode = document.getElementById('courtSelect').value;
            const date = document.getElementById('dateInput').value;
            const downloadAll = document.getElementById('downloadAllCheck').checked;
            
            // Validation
            if (!stateCode || !districtCode || !complexCode || !date) {
                showResult('Please fill all required fields', false);
                return;
            }
            
            if (!downloadAll && !courtCode) {
                showResult('Please select a specific court or choose "Download all courts"', false);
                return;
            }
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').innerHTML = '';
            
            fetch('/download', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    state_code: stateCode,
                    district_code: districtCode,
                    court_complex_code: complexCode,
                    court_code: courtCode,
                    date: date,
                    download_all: downloadAll
                })
            })
            .then(response => response.json())
            .then(result => {
                document.getElementById('loading').style.display = 'none';
                showResult(result.message, result.success);
                if (result.success) {
                    loadDownloads();
                }
            })
            .catch(error => {
                document.getElementById('loading').style.display = 'none';
                showResult('Error: ' + error.message, false);
            });
        });

        function showResult(message, isSuccess) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = isSuccess ? 'alert alert-success' : 'alert alert-danger';
            resultDiv.innerHTML = `
                <i class="fas ${isSuccess ? 'fa-check-circle' : 'fa-exclamation-circle'} me-2"></i>
                ${message}
            `;
        }
    </script>
</body>
</html>
